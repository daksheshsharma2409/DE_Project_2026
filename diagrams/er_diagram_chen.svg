    <polygon class="relation" points="640,0 760,28 640,56 520,28"/>
    <rect class="entity" x="960" y="6" width="320" height="44"/>
    <text class="entity-name" x="210" y="34">PROFILES</text>
    <text class="rel-name" x="640" y="33">rates</text>
    <text class="entity-name" x="1120" y="34">RATINGS</text>
    <text class="card" x="355" y="22">1</text><text class="card" x="920" y="22">N</text>
  </g>
  <g transform="translate(0 688)">
    <path class="line" d="M340 28 H520 M760 28 H960"/>
    <rect class="entity" x="80" y="6" width="260" height="44"/>
    <polygon class="relation" points="640,0 760,28 640,56 520,28"/>
    <rect class="entity" x="960" y="6" width="320" height="44"/>
    <text class="entity-name" x="210" y="34">TITLES</text>
    <text class="rel-name" x="640" y="33">receives</text>
    <text class="entity-name" x="1120" y="34">RATINGS</text>
    <text class="card" x="355" y="22">1</text><text class="card" x="920" y="22">N</text>
  </g>
  <g transform="translate(0 752)">
    <path class="line" d="M340 28 H520 M760 28 H960"/>
    <rect class="entity" x="80" y="6" width="260" height="44"/>
    <polygon class="relation" points="640,0 760,28 640,56 520,28"/>
    <rect class="entity" x="960" y="6" width="320" height="44"/>
    <text class="entity-name" x="210" y="34">PROFILES</text>
    <text class="rel-name" x="640" y="33">saves</text>
    <text class="entity-name" x="1120" y="34">MY_LIST</text>
    <text class="card" x="355" y="22">1</text><text class="card" x="920" y="22">N</text>
  </g>
  <g transform="translate(0 816)">
    <path class="line" d="M340 28 H520 M760 28 H960"/>
    <rect class="entity" x="80" y="6" width="260" height="44"/>
    <polygon class="relation" points="640,0 760,28 640,56 520,28"/>
    <rect class="entity" x="960" y="6" width="320" height="44"/>
    <text class="entity-name" x="210" y="34">TITLES</text>
    <text class="rel-name" x="640" y="33">appears in</text>
    <text class="entity-name" x="1120" y="34">MY_LIST</text>
    <text class="card" x="355" y="22">1</text><text class="card" x="920" y="22">N</text>
  </g>
  <g transform="translate(0 880)">
    <path class="line" d="M340 28 H520 M760 28 H960"/>
    <rect class="entity" x="80" y="6" width="260" height="44"/>
    <polygon class="relation" points="640,0 760,28 640,56 520,28"/>
    <rect class="entity" x="960" y="6" width="320" height="44"/>
    <text class="entity-name" x="210" y="34">ACCOUNTS</text>
    <text class="rel-name" x="640" y="33">receives</text>
    <text class="entity-name" x="1120" y="34">INVOICES</text>
    <text class="card" x="355" y="22">1</text><text class="card" x="920" y="22">N</text>
  </g>
  <text x="50" y="968" class="note">For titles and genres, the associative table represents the many-to-many relationship. The database diagram also shows optional movie episodes.</text>
</svg>
