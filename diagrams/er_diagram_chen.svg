    <polygon class="relation" points="640,0 760,28 640,56 520,28"/>
    <rect class="entity" x="960" y="6" width="320" height="44"/>
    <text class="entity-name" x="210" y="34">GENRES</text>
    <text class="rel-name" x="640" y="33">classifies</text>
    <text class="entity-name" x="1120" y="34">TITLE_GENRES</text>
    <text class="card" x="355" y="22">1</text><text class="card" x="920" y="22">N</text>
  </g>
  <g transform="translate(0 432)">
    <path class="line" d="M340 28 H520 M760 28 H960"/>
    <rect class="entity" x="80" y="6" width="260" height="44"/>
    <polygon class="relation" points="640,0 760,28 640,56 520,28"/>
    <rect class="entity" x="960" y="6" width="320" height="44"/>
    <text class="entity-name" x="210" y="34">PROFILES</text>
    <text class="rel-name" x="640" y="33">plays</text>
    <text class="entity-name" x="1120" y="34">VIEWING_ACTIVITY</text>
    <text class="card" x="355" y="22">1</text><text class="card" x="920" y="22">N</text>
  </g>
  <g transform="translate(0 496)">
    <path class="line" d="M340 28 H520 M760 28 H960"/>
    <rect class="entity" x="80" y="6" width="260" height="44"/>
    <polygon class="relation" points="640,0 760,28 640,56 520,28"/>
    <rect class="entity" x="960" y="6" width="320" height="44"/>
    <text class="entity-name" x="210" y="34">TITLES</text>
    <text class="rel-name" x="640" y="33">is watched in</text>
    <text class="entity-name" x="1120" y="34">VIEWING_ACTIVITY</text>
    <text class="card" x="355" y="22">1</text><text class="card" x="920" y="22">N</text>
  </g>
  <g transform="translate(0 560)">
    <path class="line" d="M340 28 H520 M760 28 H960"/>
    <rect class="entity" x="80" y="6" width="260" height="44"/>
    <polygon class="relation" points="640,0 760,28 640,56 520,28"/>
    <rect class="entity" x="960" y="6" width="320" height="44"/>
    <text class="entity-name" x="210" y="34">EPISODES</text>
    <text class="rel-name" x="640" y="33">may appear in</text>
    <text class="entity-name" x="1120" y="34">VIEWING_ACTIVITY</text>
    <text class="card" x="355" y="22">0..1</text><text class="card" x="920" y="22">N</text>
  </g>
  <g transform="translate(0 624)">
    <path class="line" d="M340 28 H520 M760 28 H960"/>
